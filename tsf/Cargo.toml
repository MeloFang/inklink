[package]
name = "inklink-tsf"
version = "2.0.4"
edition = "2024"
description = "inklink 的 TSF 文本服务（薄壳）"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_UI_TextServices",
 ] }
windows-core = "0.61"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  # AI 面板的「复制结果」：写剪贴板（只在用户点按钮时）
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
