[package]
name = "inklink-tsf"
version = "0.1.0"
edition = "2024"
description = "inklink 的 TSF 文本服务（薄壳）"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_UI_TextServices",
 ] }
windows-core = "0.61"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
